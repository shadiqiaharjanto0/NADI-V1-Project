name: nadi-ai

# Base44 development environment for NADI AI.
# Express + Vite (middleware mode) run from the cloned source; dependencies are
# installed by the one-shot `deps` service from the pinned bun.lock.
services:
  # One-shot dependency install (bun.lock is a bun lockfile, so bun is used to
  # install; the app itself runs on Node via tsx).
  deps:
    image: oven/bun:1
    working_dir: /app
    command: ["bun", "install", "--frozen-lockfile"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    command: ["sh", "-ec", "exec node_modules/.bin/tsx server.ts"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Passed through bare so the platform can supply sandbox-specific values.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      # Vite (>= 6.1) appends this to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - /run/base44/app.env
    depends_on:
      deps:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

volumes:
  node_modules:
